[project]
name = "project-home-14-1"
version = "0.1.0"
description = ""
authors = [
    {name = "konstantin",email = "kostyani4y@yandex.ru"}
]
requires-python = "^3.14"
dependencies = [
    "requests (>=2.34.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)"
]

[tool.black]
line-length = 119
target-version = ['py314']
exclude = '/\.git/'

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv']
explicit_package_bases = true

[[tool.mypy.overrides]]        # отменяет строгую проверку в директории tests_14_2_8
module = "tests.*"
disallow_untyped_defs = false

[tool.flake8]
max-line-length = 119
extend-ignore = "E203"
exclude = [".git", "__pycache__", "dist"]

[tool.pytest.ini_options]
pythonpath = ["."]
#testpaths = ["tests", "practice_14_2"]    # жеская привязка папок для воспроизведения тестов

[tool.poetry]
package-mode = false